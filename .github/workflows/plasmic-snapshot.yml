name: Plasmic Snapshot
on:
  workflow_call:
  workflow_dispatch:

concurrency: plasmic-snapshot

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_PLASMIC_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_PLASMIC_PROJECT_ID }}
      PLASMIC_PROJECT_API_TOKEN: ${{ secrets.PLASMIC_PROJECT_API_TOKEN }}
      CMS_ID: ${{ secrets.CMS_ID }}
      CMS_PUBLIC_TOKEN: ${{ secrets.CMS_PUBLIC_TOKEN }}
      CMS_SECRET_TOKEN: ${{ secrets.CMS_SECRET_TOKEN }} # enables drafts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull project tree
        run: |
          mkdir -p snapshots/cms
          curl -fsS \
            --header "x-plasmic-api-project-tokens: $NEXT_PUBLIC_PLASMIC_PROJECT_ID:$PLASMIC_PROJECT_API_TOKEN" \
            "https://studio.plasmic.app/api/v1/projects/$NEXT_PUBLIC_PLASMIC_PROJECT_ID" \
            > "snapshots/project-$(date +%Y%m%d-%H%M%S).json"
      - name: Pull CMS
        run: node scripts/cms.mjs pull "snapshots/cms/cms-$(date +%Y%m%d-%H%M%S).json"
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots
          git commit -m "Plasmic snapshot [skip ci] [CF-Pages-Skip]" || exit 0
          git pull --rebase
          git push
